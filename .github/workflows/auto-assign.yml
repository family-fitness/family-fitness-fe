name: Auto Assign

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # 팀 공통 문서에는 @v1 로 적혀 있으나, v1 은 pull_request 컨텍스트를 읽지 못해
      # "Couldn't find issue info in current context" 로 실패하고 numOfAssignee 입력도 없다.
      # 공통 문서도 같이 고쳐야 한다.
      - uses: pozil/auto-assign-issue@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: Sangjin-kmu
          numOfAssignee: 1
          allowNoAssignees: true
