name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 로컬과 같은 버전을 쓴다. .nvmrc 하나만 고치면 양쪽이 같이 움직인다
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # 여기까지와 아래 셋이 `npm run verify` 와 같다 — 로컬에서 통과한 것이 CI 에서도 통과한다
      - name: Check assets
        run: npm run check:assets

      - name: Check mock server rules
        run: npm run check:mocks

      - name: Check lib
        run: npm run check:lib

      - name: Build
        run: npm run build
